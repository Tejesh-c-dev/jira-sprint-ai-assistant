spring.application.name=sprint-assistant
app.data.directory=data/spring-xd
app.data.issues-filename=issues.csv
app.data.issue-sprint-summary-filename=issue_sprint_summary.csv
app.data.sprints-filename=sprints.csv
app.mode=${APP_MODE:csv}
app.jira.base-url=${JIRA_BASE_URL:}
app.jira.email=${JIRA_EMAIL:}
app.jira.api-token=${JIRA_API_TOKEN:}
app.jira.board-id=${JIRA_BOARD_ID:}
app.jira.poll-interval-ms=${JIRA_POLL_INTERVAL_MS:60000}
app.jira.story-points-field=${JIRA_STORY_POINTS_FIELD:customfield_10016}
app.ai.openrouter-base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
app.ai.openrouter-api-key=${OPENROUTER_API_KEY:}
app.ai.openrouter-model=${OPENROUTER_MODEL:}
